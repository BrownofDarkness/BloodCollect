# The box has 7 GiB of RAM shared with a running desktop, and ~1.3 GiB is
# already held by unrelated .NET and SQL Server processes. The template
# asked for an 8G heap, so the Gradle daemon was OOM-killed mid-build
# ("daemon disappeared"). 1.5G with in-process Kotlin completes both
# debug and release here.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=160m
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
