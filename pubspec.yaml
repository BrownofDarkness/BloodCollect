name: blood_collect
description: "Donner. Trouver. Sauver. — Gestion du don de sang en Côte d'Ivoire"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0
  firebase_analytics: ^12.6.0
  firebase_app_check: ^0.4.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.1

  # Internationalisation (dates FR, version pincée par le SDK)
  intl: ^0.20.2

  # Squelettes de chargement
  shimmer: ^4.0.0

  # UI
  cupertino_icons: ^1.0.8
  dotted_border: ^3.1.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"
  adaptive_icon_background: "#9F1239"
  adaptive_icon_foreground: "assets/logo/logo_white.png"
